# The suite's shared cross-platform build: macOS AU/VST3/CLAP, Windows
# VST3/CLAP, Linux LV2/CLAP, Standalone everywhere, plus an unsigned iOS AUv3
# compile. It checks out music-suite as a sibling because the WebUI source lives
# there (apps/rnd-companion) and CMake bundles it with esbuild during the build.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: Enkerli/enkerli-juce/.github/workflows/build-plugin.yml@main
