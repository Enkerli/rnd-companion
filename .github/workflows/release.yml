# Tag -> pre-release. Nothing here fires until a v* tag is pushed.
#
# The binaries are built FROM THE TAG by CI rather than uploaded from someone's
# machine: a release whose three platforms come from two different working trees
# cannot be reproduced, and nobody can tell by looking.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a pre-release from.
        required: true
        type: string

jobs:
  build:
    uses: Enkerli/enkerli-juce/.github/workflows/build-plugin.yml@main
    with:
      ios: false
      cmake-args: -DRND_BUILD_PROBE=OFF -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built artifacts
        uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Package one zip per platform
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          mkdir -p dist

          # Only Release, only the companion: the artifact also carries MSBuild's
          # empty Debug/MinSizeRel trees and, on some legs, the SysEx probe.
          pack () {
            local leg="$1" name="$2"; shift 2
            local src="artifacts/rnd-companion-$leg/RndCompanion_artefacts/Release"
            local out="dist/RND-Companion-$VER-$name"
            [ -d "$src" ] || { echo "no artefacts for $leg"; return 0; }
            mkdir -p "$out"
            for fmt in AU VST3 CLAP LV2 Standalone; do
              [ -d "$src/$fmt" ] && cp -R "$src/$fmt/"* "$out/" || true
            done
            cp "docs/install/$name.txt" "$out/INSTALL.txt" 2>/dev/null || true
            (cd dist && zip -qr "RND-Companion-$VER-$name.zip" "RND-Companion-$VER-$name")
            rm -rf "$out"
          }

          pack macOS   macOS
          pack Windows Windows
          pack Linux   Linux

          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # --prerelease is the load-bearing flag: GitHub badges it, `gh release
          # list` marks it, and updaters skip it.
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
            --title "RND Companion $TAG" \
            --prerelease \
            --notes-file docs/install/RELEASE_NOTES.md
