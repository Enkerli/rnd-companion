# Tag -> pre-release. Nothing here fires until a v* tag is pushed.
#
# The binaries are built FROM THE TAG by CI rather than uploaded from someone's
# machine: a release whose three platforms come from two different working trees
# cannot be reproduced, and nobody can tell by looking.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a pre-release from.
        required: true
        type: string

jobs:
  build:
    uses: Enkerli/enkerli-juce/.github/workflows/build-plugin.yml@main
    with:
      ios: false
      # Windows and Linux are otherwise only compiled here. pluginval is the
      # one thing that actually loads them, runs audio through them, and opens
      # the WebView editor.
      pluginval: true
      # The architecture list MUST stay quoted. cmake-args is substituted raw
      # into a shell `run:`, so a bare semicolon would end the cmake command and
      # try to execute `x86_64` -- yielding an arm64-only macOS build, which is
      # useless on an Intel Mac and looks like success.
      cmake-args: -DRND_BUILD_PROBE=OFF "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built artifacts
        uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Package one zip per platform
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          mkdir -p dist

          # Only Release, only the companion: the artifact also carries MSBuild's
          # empty Debug/MinSizeRel trees and, on some legs, the SysEx probe.
          pack () {
            local leg="$1" name="$2"; shift 2
            local src="artifacts/rnd-companion-$leg/RndCompanion_artefacts/Release"
            local out="dist/RND-Companion-$VER-$name"
            [ -d "$src" ] || { echo "no artefacts for $leg"; return 0; }
            mkdir -p "$out"
            for fmt in AU VST3 CLAP LV2 Standalone; do
              [ -d "$src/$fmt" ] && cp -R "$src/$fmt/"* "$out/" || true
            done
            cp "docs/install/$name.txt" "$out/INSTALL.txt" 2>/dev/null || true

            # actions/download-artifact does not preserve file modes: everything
            # arrives here 0644, so every binary we ship was going out without
            # its executable bit. On macOS that is fatal and silent -- a .app
            # whose Contents/MacOS binary is not executable simply refuses to
            # open, and alpha.1 shipped that way. It went unnoticed because
            # macOS was always tested from a local build, never from the zip.
            #
            # Ask the file itself rather than matching names: the Linux
            # standalone has no extension, and the macOS binaries are buried
            # inside bundles.
            find "$out" -type f -print0 | while IFS= read -r -d '' f; do
              case "$(file -b "$f")" in
                Mach-O*|ELF*) chmod +x "$f" ;;
              esac
            done

            (cd dist && zip -qr "RND-Companion-$VER-$name.zip" "RND-Companion-$VER-$name")
            rm -rf "$out"
          }

          pack macOS   macOS
          pack Windows Windows
          pack Linux   Linux

          cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # --prerelease is the load-bearing flag: GitHub badges it, `gh release
          # list` marks it, and updaters skip it.
          # Idempotent: re-running a release for an existing tag replaces its
          # assets instead of failing outright. Without this, repairing a bad
          # release means deleting it first, and a half-deleted release is a
          # worse thing to leave lying around than a repaired one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" \
              --title "RND Companion $TAG" \
              --prerelease \
              --notes-file docs/install/RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --title "RND Companion $TAG" \
              --prerelease \
              --notes-file docs/install/RELEASE_NOTES.md
          fi
